      com.trading.type: "bot"

  # ---------------------------------------------------------------------------
  # PORTFOLIO SUPERVISOR — read-only monitor, no trade permissions
  # ---------------------------------------------------------------------------
  portfolio-supervisor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfolio-supervisor
    restart: unless-stopped
    environment:
      BOT_NAME: portfolio_supervisor
      PYTHONPATH: /app
      # Runtime paths
      STATE_DIR: /app/state
      HEARTBEAT_DIR: /app/heartbeat
      LOGS_DIR: /app/logs
      JOURNALS_DIR: /app/data/journals
      CACHE_DIR: /app/data/cache
      # Supervisor is read-only — no subaccount credentials needed
    volumes:
      - trading-state:/app/state
      - trading-heartbeat:/app/heartbeat
      - trading-logs:/app/logs
      - trading-journals:/app/data/journals
      - trading-snapshots:/app/data/snapshots
      - trading-cache:/app/data/cache
    command: ["python", "-m", "apps.portfolio_supervisor.main"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /app/heartbeat/alpha_bot_heartbeat.json && find /app/heartbeat/alpha_bot_heartbeat.json -mmin -2 -print"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
    labels:
      com.coolify.managed: "true"
      com.trading.bot: "supervisor"
      com.trading.type: "supervisor"

# =============================================================================
# Volumes — define here so Coolify can create/mount them as named volumes.
# These persist across deployments and survive container restarts.
# =============================================================================
volumes:
  trading-state:
  trading-heartbeat:
  trading-logs:
  trading-journals:
  trading-snapshots:
  trading-cache:
