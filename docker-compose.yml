# =============================================================================
# TRADING PORTFOLIO SYSTEM — Docker Compose for Coolify
# =============================================================================
# Deployment: Coolify pulls this compose, builds nothing — uses python:3.12-slim
# Bootstrap: each container downloads source from GitHub at runtime
# Health check: file-based heartbeat, Docker watches /app/heartbeat/*.json
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # ALPHA BOT — H4 SMC/ICT, BTCUSDT, $50 capital
  # ---------------------------------------------------------------------------
  alpha-bot:
    image: python:3.12-slim
    container_name: alpha-bot
    restart: unless-stopped
    volumes:
      - alpha-state:/app/state
      - alpha-hb:/app/heartbeat
      - alpha-logs:/app/logs
      - alpha-journals:/app/data/journals
      - alpha-snapshots:/app/data/snapshots
      - alpha-cache:/app/data/cache
    environment:
      BOT_NAME: alpha_bot
      SUBACCOUNT_NAME: BYBIT_ALPHA
      PYTHONPATH: /app
      STATE_DIR: /app/state
      HEARTBEAT_DIR: /app/heartbeat
      LOGS_DIR: /app/logs
      JOURNALS_DIR: /app/data/journals
      CACHE_DIR: /app/data/cache
      BYBIT_API_KEY_ALPHA_BOT: "${BYBIT_API_KEY_ALPHA_BOT}"
      BYBIT_API_SECRET_ALPHA_BOT: "${BYBIT_API_SECRET_ALPHA_BOT}"
    command:
      - python
      - -c
      - |
        import urllib.request, tarfile, os, sys, time, json, subprocess
        BOT_NAME = "alpha_bot"
        HB_PATH = "/app/heartbeat/alpha_bot_heartbeat.json"
        def update_hb(state, msg=""):
            try:
                with open(HB_PATH, "w") as f:
                    json.dump({"bot_id": BOT_NAME, "status": state, "msg": msg, "ts": time.time(), "pid": os.getpid()}, f)
            except: pass
        update_hb("booting")
        print("[0] HB written - bot: " + BOT_NAME)
        proc = None
        while True:
            try:
                if proc is None:
                    print("[DOWNLOAD] Fetching tarball...")
                    urllib.request.urlretrieve(
                        "https://github.com/elmilnombres/trading-master-minimax/archive/refs/heads/master.tar.gz",
                        "/tmp/src.tar.gz")
                    sz = os.path.getsize("/tmp/src.tar.gz")
                    print("[EXTRACT] %d bytes" % sz)
                    os.makedirs("/tmp/src", exist_ok=True)
                    tarfile.open("/tmp/src.tar.gz").extractall("/tmp/src")
                    for item in os.listdir("/tmp/src"):
                        s=os.path.join("/tmp/src",item); d=os.path.join("/app",item)
                        if os.path.isdir(s):
                            if os.path.exists(d): os.system("rm -rf "+d)
                            os.rename(s,d)
                        else:
                            if os.path.exists(d): os.remove(d)
                            os.rename(s,d)
                    os.remove("/tmp/src.tar.gz")
                    print("[DEPS] Installing...")
                    os.system("pip install --no-cache-dir -q pydantic pydantic-settings httpx pyyaml python-dotenv 2>&1 | tail -2")
                    update_hb("installed")
                    print("[READY] Starting: apps.alpha_bot.main")
                    sys.stdout.flush()
                else:
                    print("[RESTART] Waiting 5s before restart...")
                    update_hb("restarting")
                    time.sleep(5)
            except Exception as e:
                print("[ERR] " + str(e)); import traceback; traceback.print_exc()
                update_hb("bootstrap_err", str(e))
                time.sleep(5)
            try:
                proc = subprocess.Popen(
                    [sys.executable, "-m", "apps.alpha_bot.main"],
                    cwd="/app",
                    env={**os.environ, "PYTHONPATH": "/app"})
                print("[BOT] PID=%d" % proc.pid)
                update_hb("running")
                sys.stdout.flush()
                while proc.poll() is None:
                    time.sleep(5)
                    update_hb("running")
                rc = proc.returncode
                print("[BOT_DIED] rc=%d" % rc)
                update_hb("bot_died", "rc=%d" % rc)
                proc = None
            except Exception as e:
                print("[ERR bot] " + str(e)); import traceback; traceback.print_exc()
                update_hb("bot_err", str(e))
                proc = None
                time.sleep(5)
    healthcheck:
      test:
        - CMD-SHELL
        - test -f /app/heartbeat/alpha_bot_heartbeat.json
      interval: 30s
      timeout: 60s
      retries: 30
      start_period: 120s
    labels:
      - coolify.managed=true
      - coolify.version=4.0.0-beta.470

