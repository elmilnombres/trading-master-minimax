[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trading-portfolio-system"
version = "0.1.0"
description = "SMC/ICT algorithmic trading system — Bybit — live minimal controlled"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["apps", "core", "exchange", "schemas"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python-version = "3.12"
strict = true